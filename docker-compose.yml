version: '3.8'

services:
  zerotier:
    image: zerotier/zerotier-one:latest
    # Jika ingin build dari Dockerfile lokal, hapus `image:` dan gunakan `build:` di bawah:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: zerotier-one
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./zerotier-data:/var/lib/zerotier-one
